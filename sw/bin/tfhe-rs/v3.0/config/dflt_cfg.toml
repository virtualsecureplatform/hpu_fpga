
[fpga]
  regmap=["sw/bin/tfhe-rs/config/dflt/dflt_regif_core.toml"]
  polling_us=100000
  node_id=[0]

[fpga.ffi.Sim]
  ipc_name="/tmp/${USER}/hpu_sim_ipc"
  iopq={head_ofst=0x0, tail_ofst=0x8, data_ofst=0x10, size_w=512, mem= {Ddr={offset=0x2000_0000}}}
  ackq={head_ofst=0x0, tail_ofst=0x8, data_ofst=0x10, size_w=512, mem= {Ddr={offset=0x2000_1000}}}

[rtl]
  bpip_use = true
  bpip_use_opportunism = true
  bpip_timeout = 100_000

[board]
  ct_pc = [
    {Hbm= {pc=32}},
    {Hbm= {pc=33}},
  ]
  user_size = 12288
  b2b_size = 4096
  heap_size = 16384

  lut_mem = 256
  lut_pc = {Hbm={pc=34}}

  fw_size= 16777216 # i.e. 16 MiB
  fw_pc = {Ddr= {offset= 0x3900_0000}} # NB: Allocation must take place in the Discrete DDR

  bsk_pc = [
    {Hbm={pc=8}},
    {Hbm={pc=10}},
    {Hbm={pc=12}},
    {Hbm={pc=14}},
    {Hbm={pc=24}},
    {Hbm={pc=26}},
    {Hbm={pc=28}},
    {Hbm={pc=30}},
    {Hbm={pc=40}},
    {Hbm={pc=42}},
    {Hbm={pc=44}},
    {Hbm={pc=46}},
    {Hbm={pc=56}},
    {Hbm={pc=58}},
    {Hbm={pc=60}},
    {Hbm={pc=62}}
  ]

  ksk_pc = [
    {Hbm={pc=0}},
    {Hbm={pc=1}},
    {Hbm={pc=2}},
    {Hbm={pc=3}},
    {Hbm={pc=4}},
    {Hbm={pc=5}},
    {Hbm={pc=6}},
    {Hbm={pc=7}},
    {Hbm={pc=16}},
    {Hbm={pc=17}},
    {Hbm={pc=18}},
    {Hbm={pc=19}},
    {Hbm={pc=20}},
    {Hbm={pc=21}},
    {Hbm={pc=22}},
    {Hbm={pc=23}}
  ]

  trace_pc = {Hbm={pc=35}}
  trace_depth = 32 # In MB

[firmware]
  implementation = "Ilp"
  integer_w=[2,4,6,8,10,12,14,16,32]
  pbs_batch_w=8
  use_ipip=false
  kogge_cfg=""
  custom_iop = {}
  op_cfg.by_op = {}
  min_batch_size = 8

[firmware.op_cfg.default]
  fill_batch_fifo = true
  min_batch_size = false
  use_tiers = false
  flush_behaviour = "Patient"
  flush = true

